name: UrbanFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Code Quality & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  docker-build:
    name: Container Build & Health Probe
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: urbanflow-traffic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container health test
        run: |
          docker run -d --name test-container -p 3000:3000 urbanflow-traffic:latest
          sleep 5
          docker ps
          curl --fail --retry 5 --retry-delay 3 http://localhost:3000/api/health || exit 1
          docker stop test-container

  deploy:
    name: Production Deployment Gate
    needs: [validate-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Ready Notification
        run: |
          echo "✅ All CI tests, static validation, and Docker builds passed."
          echo "🚀 Release is primed for automated staging/production rollout."
